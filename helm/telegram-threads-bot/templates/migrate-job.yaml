apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "telegram-threads-bot.fullname" . }}-migrate
  labels:
    {{- include "telegram-threads-bot.labels" . | nindent 4 }}
  annotations:
    # D14: migrations run before the release is installed/upgraded.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "telegram-threads-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "telegram-threads-bot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["npm", "run", "db:migrate"]
          env:
            # readOnlyRootFilesystem: npm needs a writable HOME for its logs.
            - name: HOME
              value: /tmp
            - name: npm_config_update_notifier
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
