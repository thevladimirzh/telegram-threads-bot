# CI — clean verification on every push/PR (AGENTS.md: `npm ci && npm run typecheck && npm test`).
# Jobs: test (Node 26, full suite), docker (image buildability, no push), helm (chart lint/template).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies (clean, from lockfile)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -t telegram-threads-bot:ci .

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          # Pin for reproducible CI (matches the local verification version).
          version: v4.3.1
      - name: Lint chart (polling, CI values)
        run: helm lint helm/telegram-threads-bot -f helm/telegram-threads-bot/ci/ci-values.yaml
      - name: Render templates (polling)
        run: helm template telegram-threads-bot helm/telegram-threads-bot -f helm/telegram-threads-bot/ci/ci-values.yaml > /dev/null
      - name: Lint + render templates (webhook + ingress)
        run: |
          helm lint helm/telegram-threads-bot -f helm/telegram-threads-bot/ci/ci-values.yaml -f helm/telegram-threads-bot/ci/ci-values-webhook.yaml
          helm template telegram-threads-bot helm/telegram-threads-bot -f helm/telegram-threads-bot/ci/ci-values.yaml -f helm/telegram-threads-bot/ci/ci-values-webhook.yaml > /dev/null
      - name: Guard intact (empty adminIds must fail)
        run: |
          if helm template telegram-threads-bot helm/telegram-threads-bot > /dev/null 2>err.txt; then
            echo "::error::chart no longer validates config.adminIds (production guard broken)"; exit 1
          fi
          grep -q "config.adminIds must list at least one admin id" err.txt
